[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sse-stat-arb"
version = "0.1.0"
description = "SSE daily market data system for pairs trading / statistical arbitrage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pymongo>=4.10",
  "yfinance>=0.2.50",
  "pandas>=2.2",
  "httpx>=0.27",
  "pydantic-settings>=2.6",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "statsmodels>=0.14",
  "python-pptx>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "mongomock>=4.3",
]

[project.scripts]
sse-data = "sse_data.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
